callable.get.formular={call pkg_emailsms_service.pr_getSystemFormular(?) }
callable.get.dateparam={call pkg_emailsms_service.pr_getDateParam(?) }
callable.get.datasource_ext={call pkg_emailsms_service.pr_getDataSourceExt(?) }

sql.get.report_title=SELECT 'REPORT_TITLE' KEY, T.DESCRIPTION VALUE FROM RPTMASTER T WHERE RPTID = ?
sql.get.report_param=SELECT FLDNAME, DATATYPE, DEFVAL FROM RPTFIELDS WHERE OBJNAME = ? AND ISPARAM = 'Y' ORDER BY ODRNUM
sql.emaillog.pending=pkg_emailsms_service.pr_getPendingEmail(OUT REF_CURSOR refcursor, 'maxrow' VARCHAR 'String' ||{header.maxrow})
#sql.emaillog.pending=pkg_emailsms_service.pr_getPendingEmail(OUT REF_CURSOR refcursor, 'maxrow' VARCHAR 'String' :#maxrow)

sql.eventlog.process=NMPKS_EMS.GenTemplates('p_message_type' VARCHAR 'String' :#MSGTYPE, 'p_key_value' VARCHAR 'String' :#KEYVALUE)
sql.check.batch=pkg_emailsms_service.pr_checkHostStatus(OUT VARCHAR hostatus)


camel.emaillog.pending=sql-stored:${sql.emaillog.pending}?dataSource=#dataSource
camel.eventlog.process=sql-stored:${sql.eventlog.process}?dataSource=#dataSource
camel.check.batch=sql-stored:${sql.check.batch}?dataSource=#dataSource




sql.update.emaillog_exception=pkg_emailsms_service.pr_updateEmaillogException('responseCode' VARCHAR 'String' :#responseCode,'emailLogId' VARCHAR 'String' :#emailLogId)
sql.update.emaillog_ongoing=pkg_emailsms_service.pr_updateEmaillogOnGoing('emailLogId' VARCHAR 'String' :#emailLogId)
sql.update.emaillog_send=pkg_emailsms_service.pr_updateEmaillogSend('emailLogId' VARCHAR 'String' :#emailLogId)
sql.update.emaillog_processed=pkg_emailsms_service.pr_updateEmaillogProcessed('eventLogID' VARCHAR 'String' :#eventLogID)
sql.get.event_pending=pkg_emailsms_service.pr_getEventPending(OUT REF_CURSOR refcursor)

camel.update.emaillog.exception=sql-stored:${sql.update.emaillog_exception}?dataSource=#dataSource
camel.update.emaillog.ongoing=sql-stored:${sql.update.emaillog_ongoing}?dataSource=#dataSource
camel.update.emaillog.retry=sql:UPDATE EMAILLOG SET STATUS = 'A', RETRY_COUNT = RETRY_COUNT + 1, LAST_RETRY_TIME = SYSDATE WHERE STATUS = 'E' AND RETRY_COUNT < ${emailsms.email.maxretry}?dataSource=#dataSource
camel.update.emaillog.send=sql-stored:${sql.update.emaillog_send}?dataSource=#dataSource
camel.update.event.processed=sql-stored:${sql.update.emaillog_processed}?dataSource=#dataSource
#camel.get.event.pending=sql:SELECT * FROM LOG_NOTIFY_EVENT WHERE STATUS = 'A' ORDER BY AUTOID?dataSource=#dataSource
camel.get.event.pending=sql-stored:${sql.get.event_pending}?dataSource=#dataSource